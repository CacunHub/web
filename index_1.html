<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feral Panel</title>
<style>
  :root {
    --bg:#0e0f13; --panel:#16181f; --panel2:#1c1f28; --line:#262a35; --text:#e8eaf0; --muted:#8a91a3;
    --accent:#e0642f; --accent2:#f08a55; --ok:#3fb97a; --bad:#e5534b;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f4f5f8; --panel:#fff; --panel2:#f0f1f5; --line:#dfe2ea; --text:#1b1d24; --muted:#6a7183;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; letter-spacing:.3px; }
  header h1 b { color:var(--accent); }
  .grow { flex:1; }
  .pill { font-size:12px; padding:3px 9px; border-radius:99px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); }
  .pill.ok { color:var(--ok); } .pill.bad { color:var(--bad); }
  button { font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  input[type=text], input[type=password], input[type=search] { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .login { max-width:380px; margin:12vh auto 0; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; }
  .login h2 { margin:0 0 4px; } .login p { color:var(--muted); margin:0 0 14px; }
  .login .row { display:flex; gap:8px; }
  .err { color:var(--bad); margin-top:10px; min-height:1.2em; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tab { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:10px; background:var(--panel); border:1px solid var(--line); cursor:pointer; }
  .tab.sel { border-color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .stat .k { color:var(--muted); font-size:12px; } .stat .v { font-size:18px; font-weight:600; margin-top:2px; word-break:break-word; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:800px) { .cols { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .card h3 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .card .body { padding:10px 14px; overflow:auto; max-height:460px; }
  .card .search { padding:8px 14px; border-bottom:1px solid var(--line); }
  .trow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
  .trow:last-child { border-bottom:0; }
  .sw { position:relative; width:38px; height:22px; flex:none; }
  .sw input { opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:1; }
  .sw span { position:absolute; inset:0; background:var(--line); border-radius:99px; transition:.15s; }
  .sw span::after { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .sw input:checked + span { background:var(--accent); } .sw input:checked + span::after { transform:translateX(16px); }
  .sw input:disabled { cursor:not-allowed; } .sw input:disabled + span { opacity:.45; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; } .chip { background:var(--panel2); border:1px solid var(--line); border-radius:99px; padding:2px 10px; font-size:12px; }
  .muted { color:var(--muted); } table { width:100%; border-collapse:collapse; } td { padding:5px 0; border-bottom:1px solid var(--line); } td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1><b>Feral</b> Panel</h1>
  <span class="grow"></span>
  <span id="conn" class="pill">offline</span>
  <button id="logout" class="hidden">Log out</button>
</header>
<main>
  <section id="login" class="login">
    <h2>Enter your key</h2>
    <p>Enter the same key you typed into the hub's Remote Panel.</p>
    <form id="form" class="row">
      <input id="key" type="password" placeholder="your key" autocomplete="off" spellcheck="false">
      <button class="primary" type="submit">Connect</button>
    </form>
    <div id="err" class="err"></div>
  </section>

  <section id="app" class="hidden">
    <div id="tabs" class="tabs"></div>
    <div id="acct"></div>
    <div id="none" class="empty hidden">No account is connected with this key right now. Open the hub in Roblox, type the key in Remote Panel and press Connect. (If you are sure it is connected, check the key for typos.)</div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const accounts = new Map();   // userId -> account view
  let selected = null, key = "", retry = 0, loggedIn = false;
  const fmt = (n) => (typeof n === "number" ? n.toLocaleString() : "—");
  const el = (tag, props = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e[k] = v; }
    for (const c of kids) e.append(c);
    return e;
  };
  const store = { get: () => { try { return sessionStorage.getItem("feral_key") || ""; } catch { return ""; } },
                  set: (v) => { try { v ? sessionStorage.setItem("feral_key", v) : sessionStorage.removeItem("feral_key"); } catch {} } };

  function setConn(text, cls) { const c = $("conn"); c.textContent = text; c.className = "pill " + (cls || ""); }

  async function api(path, payload) {
    const r = await fetch("/api/" + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    return r.json();
  }

  let timer = null;
  async function poll() {
    clearTimeout(timer);
    try {
      const m = await api("view", { key });
      if (!m.ok) {
        $("err").textContent = m.error || "key rejected"; store.set(""); loggedIn = false; setConn("offline", "bad");
        $("login").classList.remove("hidden"); $("app").classList.add("hidden"); $("logout").classList.add("hidden");
        return;
      }
      if (!loggedIn) { loggedIn = true; store.set(key); $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("logout").classList.remove("hidden"); }
      setConn("live", "ok");
      accounts.clear(); m.accounts.forEach((a) => accounts.set(a.userId, a)); render();
    } catch { setConn("offline", "bad"); }
    timer = setTimeout(poll, 3000);
  }
  function connect() { poll(); }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault(); key = $("key").value.trim(); $("err").textContent = ""; if (!key) return;
    loggedIn = false; connect();
  });
  $("logout").addEventListener("click", () => { store.set(""); loggedIn = false; clearTimeout(timer); location.reload(); });
  const saved = store.get(); if (saved) { key = saved; connect(); }

  // ------------------------------------------------------------ render
  const search = { toggles: "", inv: "" };
  const pending = new Map();

  function render() {
    const ids = [...accounts.keys()];
    if (selected === null || !accounts.has(selected)) selected = ids[0] ?? null;
    $("none").classList.toggle("hidden", ids.length > 0);

    const tabs = $("tabs"); tabs.replaceChildren();
    for (const id of ids) {
      const a = accounts.get(id);
      const t = el("div", { class: "tab" + (id === selected ? " sel" : "") }, el("span", { class: "dot" + (a.online ? " on" : "") }), el("span", { text: a.name }));
      t.onclick = () => { selected = id; render(); };
      tabs.append(t);
    }
    const root = $("acct");
    const keepScroll = [...root.querySelectorAll(".body")].map((b) => b.scrollTop);
    const focusId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.search : null;
    root.replaceChildren();
    if (selected === null) return;
    const a = accounts.get(selected), s = a.state;
    if (!s) { root.append(el("div", { class: "empty", text: "Waiting for first update…" })); return; }

    const grid = el("div", { class: "grid" });
    const stat = (k, v) => grid.append(el("div", { class: "stat" }, el("div", { class: "k", text: k }), el("div", { class: "v", text: v })));
    stat("Status", !a.online ? "Offline" : (s.status.alive ? (s.status.text || "Online") : "Dead / loading"));
    stat("Level", fmt(s.stats.level)); stat("Peli", fmt(s.stats.peli)); stat("Bounty", fmt(s.stats.bounty));
    stat("Fruit", s.stats.fruit || "—"); stat("Race", s.stats.race || "—");
    if (s.status.health !== null) stat("Health", fmt(s.status.health));
    stat("Last update", a.seen ? new Date(a.seen).toLocaleTimeString() : "—");
    root.append(grid);

    const activeCard = el("div", { class: "card", style: "margin-bottom:14px" }, el("h3", { text: `Doing right now (${s.status.active.length})` }));
    const chips = el("div", { class: "body chips" });
    if (!s.status.active.length) chips.append(el("span", { class: "muted", text: "Nothing enabled." }));
    s.status.active.forEach((n) => chips.append(el("span", { class: "chip", text: n })));
    activeCard.append(chips); root.append(activeCard);

    const cols = el("div", { class: "cols" });
    cols.append(toggleCard(a, s), inventoryCard(s));
    root.append(cols);

    root.querySelectorAll(".body").forEach((b, i) => { if (keepScroll[i] !== undefined) b.scrollTop = keepScroll[i]; });
    if (focusId) { const f = root.querySelector(`[data-search="${focusId}"]`); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
  }

  function searchBox(name) {
    const i = el("input", { type: "search", placeholder: "Search…", value: search[name] });
    i.dataset.search = name;
    i.oninput = () => { search[name] = i.value; render(); };
    return el("div", { class: "search" }, i);
  }

  function toggleCard(a, s) {
    const card = el("div", { class: "card" }, el("h3", { text: "Features" }), searchBox("toggles"));
    const body = el("div", { class: "body" });
    const q = search.toggles.toLowerCase();
    const list = s.toggles.filter((t) => t.title.toLowerCase().includes(q));
    if (!list.length) body.append(el("div", { class: "muted", text: "No matches." }));
    for (const t of list) {
      const p = pending.get(a.userId + ":" + t.id);
      if (p) { if (p.v === t.value || Date.now() > p.until) pending.delete(a.userId + ":" + t.id); else t.value = p.v; }
      const cb = el("input", { type: "checkbox", checked: t.value, disabled: !a.online });
      cb.onchange = () => {
        pending.set(a.userId + ":" + t.id, { v: cb.checked, until: Date.now() + 25000 }); // keep showing it until the hub confirms
        api("set", { key, userId: a.userId, id: t.id, value: cb.checked });
      };
      body.append(el("div", { class: "trow" }, el("span", { text: t.title }), el("label", { class: "sw" }, cb, el("span"))));
    }
    card.append(body); return card;
  }

  function inventoryCard(s) {
    const entries = Object.entries(s.inventory).sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0]));
    const card = el("div", { class: "card" }, el("h3", {}, el("span", { text: "Inventory" }), el("span", { class: "muted", text: `${entries.length} items` })), searchBox("inv"));
    const body = el("div", { class: "body" });
    const q = search.inv.toLowerCase();
    const list = entries.filter(([n]) => n.toLowerCase().includes(q));
    if (!list.length) body.append(el("div", { class: "muted", text: entries.length ? "No matches." : "Inventory empty." }));
    else { const tb = el("table"); list.forEach(([n, c]) => tb.append(el("tr", {}, el("td", { text: n }), el("td", { text: "×" + fmt(c) })))); body.append(tb); }
    card.append(body); return card;
  }
})();
</script>
</body>
</html>
